name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The firmware compiled for the host with g++ and unit tests
      # (test/native/README.md).
      - name: Native tests
        run: make -f test/native/makefile -j"$(nproc)"

      - name: Native tests (AddressSanitizer)
        run: make -f test/native/makefile -j"$(nproc)" SANITIZE=1

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # avr-gcc 4.3.5 / avr-libc 1.6.8 (Debian Squeeze i386, digest-pinned):
      # newer compilers miscompile the oscillator code. build-image.sh works
      # around the runner's seccomp/DNS limits for 32-bit apt.
      - name: Build toolchain image
        run: bash toolchain/build-image.sh

      - name: Check generated resources
        run: bash toolchain/avr-resources.sh . shruthi/makefile check

      - name: Build firmware (.hex + .syx)
        run: bash toolchain/avr-make.sh . shruthi/makefile syx

      - name: Size gates
        run: bash toolchain/size-report.sh . | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: shooz-firmware
          path: |
            build/shruthi1/shruthi1.syx
            build/shruthi1/shruthi1.hex
